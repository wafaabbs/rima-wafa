<meta property="og:description" content="&quot;Dan di antara tanda-tanda (kebesaran)-Nya ialah Dia menciptakan pasangan-pasangan untukmu dari jenismu sendiri, agar kamu cenderung dan merasa tenteram kepadanya, dan Dia menjadikan di antaramu rasa kasih dan sayang. Sungguh, pada yang demikian itu benar-benar terdapat tanda-tanda (kebesaran Allah) bagi kaum yang berpikir.&quot; (QS. Ar-Rum : 21)&#10;&#10;𝗪𝗲𝗱𝗱𝗶𝗻𝗴 𝗢𝗳 𝗥𝗶𝗺𝗮 𝗱𝗮𝗻 𝗪𝗮𝗳𝗮&#10;𝗔𝗵𝗮𝗱, 𝟭𝟬 𝗝𝗮𝗻𝘂𝗮𝗿𝗶 𝟮𝟬𝟮𝟳">

<style>html,body{margin:0;background:#FFFCF3}</style>
<script>
(function () {
  var onGithubIo = /\.github\.io$/.test(location.hostname);
  var parts = location.pathname.split('/').filter(Boolean);
  var root = onGithubIo && parts.length ? '/' + parts.shift() + '/' : '/';

  // undangan hanya punya satu tingkat path: /Nama-Tamu
  if (parts.length !== 1 || /\/$/.test(location.pathname)) {
    var guest = parts.length ? parts[parts.length - 1] : '';
    location.replace(root + guest + location.search + location.hash);
    return;
  }

  fetch(root + 'index.html', { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(function (html) { document.open(); document.write(html); document.close(); })
    .catch(function () { location.replace(root); });
})();
</script>
