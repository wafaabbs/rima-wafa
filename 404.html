<script>
(function () {
  var onGithubIo = /\.github\.io$/.test(location.hostname);
  var parts = location.pathname.split('/').filter(Boolean);
  var root = onGithubIo && parts.length ? '/' + parts.shift() + '/' : '/';

  // undangan hanya punya satu tingkat path: /Nama-Tamu
  if (parts.length !== 1 || /\/$/.test(location.pathname)) {
    var guest = parts.length ? parts[parts.length - 1] : '';
    location.replace(root + guest + location.search + location.hash);
    return;
  }

  fetch(root + 'index.html', { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(function (html) { document.open(); document.write(html); document.close(); })
    .catch(function () { location.replace(root); });
})();
</script>
